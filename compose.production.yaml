services:
  database:
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}

  app:
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      LEDGER_USER_NAME: ${LEDGER_USER_NAME:?Set LEDGER_USER_NAME}
      LEDGER_USER_PASSWORD: ${LEDGER_USER_PASSWORD:?Set LEDGER_USER_PASSWORD}
      LEDGER_ADMIN_NAME: ${LEDGER_ADMIN_NAME:?Set LEDGER_ADMIN_NAME}
      LEDGER_ADMIN_PASSWORD: ${LEDGER_ADMIN_PASSWORD:?Set LEDGER_ADMIN_PASSWORD}
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:?Set PROVIDER_WEBHOOK_SECRET}
